<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zeyad DevOps Command</title>
<link rel="stylesheet" href="vendor/xterm.css">
<style>
:root{--bg:#f4f6f8;--sf:#ffffff;--sf2:#eef1f4;--bd:#dde2e8;--tx:#16202a;--mu:#64748b;--ac:#0d9488;--ac2:#0f766e;--acs:#ccfbf1;--code:#0b1220;--cd:#d7f7e6;--p1:#fbbf24;--p2:#67e8f9;--p3:#f87171;--l1:#16a34a;--l2:#d97706;--l3:#dc2626;--sh:0 1px 2px rgba(15,23,42,.06),0 4px 14px rgba(15,23,42,.05);--th:320px;color-scheme:light}
:root[data-theme="dark"]{--bg:#0d1117;--sf:#161b22;--sf2:#1c232c;--bd:#2a323c;--tx:#e6edf3;--mu:#8b98a8;--ac:#2dd4bf;--ac2:#14b8a6;--acs:#0f3a36;--code:#05080d;--sh:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:8px}::-webkit-scrollbar-thumb:hover{background:var(--mu)}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--sf);border-bottom:1px solid var(--bd);flex-shrink:0;z-index:20}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;white-space:nowrap}
.logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--ac),#0ea5e9);color:#fff;display:grid;place-items:center;font-weight:800;font:700 12px ui-monospace,monospace;direction:ltr}
.search{flex:1;max-width:560px;position:relative}
.search input{width:100%;padding:8px 14px;border:1px solid var(--bd);background:var(--sf2);border-radius:10px;outline:none}
.search input:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
.search kbd{position:absolute;inset-inline-end:10px;top:7px;font:11px ui-monospace,monospace;color:var(--mu);border:1px solid var(--bd);border-radius:5px;padding:0 5px;background:var(--sf)}
.seg{display:flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden;background:var(--sf2)}
.seg button{border:0;background:none;padding:6px 11px;color:var(--mu)}
.seg button.on{background:var(--ac);color:#fff}
.ib{border:1px solid var(--bd);background:var(--sf2);border-radius:10px;padding:6px 11px;white-space:nowrap}
.ib:hover{border-color:var(--ac)}.ib.on{background:var(--ac);color:#fff;border-color:var(--ac)}
select.ib{padding:6px 8px}
#body{flex:1;display:flex;min-height:0}
nav{width:270px;flex-shrink:0;background:var(--sf);border-inline-end:1px solid var(--bd);overflow:auto;padding:10px 8px 24px}
nav h4{margin:14px 10px 4px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
nav button{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;padding:7px 10px;border-radius:9px;text-align:start}
nav button:hover{background:var(--sf2)}nav button.on{background:var(--acs);color:var(--ac2);font-weight:600}
nav .ic{width:22px;text-align:center}nav .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav .ct{font-size:11px;color:var(--mu);background:var(--sf2);padding:0 7px;border-radius:99px}
main{flex:1;overflow:auto;padding:18px 22px 40px;min-width:0}
.wrap{max-width:1060px;margin:auto}
.hero{background:linear-gradient(135deg,#0f766e,#0369a1);color:#fff;border-radius:16px;padding:22px 24px;box-shadow:var(--sh)}
.hero h1{margin:0 0 6px;font-size:24px}.hero p{margin:0;opacity:.92}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.stats span{background:rgba(255,255,255,.16);padding:4px 12px;border-radius:99px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:16px}
.tcard{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px;text-align:start;box-shadow:var(--sh);transition:.15s}
.tcard:hover{transform:translateY(-2px);border-color:var(--ac)}
.tcard .i{font-size:26px}.tcard b{display:block;margin-top:4px}.tcard small{color:var(--mu);display:block;margin-top:2px}
.tcard em{font-style:normal;font-size:12px;color:var(--ac2);margin-top:6px;display:block}
h2.sec{margin:26px 0 10px;font-size:16px;display:flex;align-items:center;gap:8px}
h2.sec::after{content:"";flex:1;height:1px;background:var(--bd)}
.thead{display:flex;align-items:center;gap:14px;margin-bottom:4px}.thead .i{font-size:34px}.thead h1{margin:0;font-size:22px}.thead p{margin:2px 0 0;color:var(--mu)}
.panel{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-top:12px;box-shadow:var(--sh)}
.panel h3{margin:0 0 8px;font-size:14px}
.inst{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
.inst .t{font-size:12px;color:var(--mu);margin-bottom:4px}
.inst pre.cmd{margin:0}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;margin-top:10px;box-shadow:var(--sh);overflow:hidden}
.card:hover{border-color:color-mix(in srgb,var(--ac) 50%,var(--bd))}
.ch{display:flex;align-items:center;gap:8px;padding:9px 12px 4px}
.lv{width:9px;height:9px;border-radius:50%;flex-shrink:0}.lv1{background:var(--l1)}.lv2{background:var(--l2)}.lv3{background:var(--l3)}
.ct1{flex:1;font-weight:600;min-width:0}
.ct1 small{display:block;font-weight:400;color:var(--mu);font-size:12px}
.ab{display:flex;gap:5px;flex-shrink:0}
.ab button{border:1px solid var(--bd);background:var(--sf2);border-radius:8px;padding:3px 9px;font-size:13px}
.ab button:hover{border-color:var(--ac)}
.ab .run{background:var(--ac2);border-color:var(--ac2);color:#fff;font-weight:600}.ab .run:hover{background:var(--ac)}
.ab .fav.on{color:#f59e0b;border-color:#f59e0b}.ab .opb.on{background:var(--acs);border-color:var(--ac)}
pre.cmd{direction:ltr;text-align:left;margin:6px 12px 10px;background:var(--code);color:var(--cd);padding:9px 12px;border-radius:9px;font:13px/1.55 ui-monospace,"SF Mono",Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;cursor:pointer;border:1px solid transparent;transition:.12s}
pre.cmd:hover{border-color:var(--ac);box-shadow:0 0 0 2px var(--acs)}
.k1{color:var(--p1);font-weight:600}.k2{color:var(--p2)}.k3{color:var(--p3);font-weight:700;text-decoration:underline wavy}
.opt{border-top:1px dashed var(--bd);padding:10px 12px;background:var(--sf2);display:none}
.card.open .opt{display:block}
.opt h5{margin:12px 0 6px;font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}.opt h5:first-child{margin-top:0}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.pg label,.fv label{display:block;font-size:12px;color:var(--mu)}
.pg input,.pg select,.more input,.fv input,.fv select{width:100%;margin-top:2px;padding:5px 8px;border:1px solid var(--bd);border-radius:8px;background:var(--sf);direction:ltr;text-align:left;font:13px ui-monospace,Menlo,Consolas,monospace}
.pg input:focus,.pg select:focus,.more input:focus,.fv input:focus{outline:none;border-color:var(--ac)}
input.miss{border-color:var(--p3)!important;background:color-mix(in srgb,var(--p3) 12%,var(--sf))!important}
.fl{display:flex;flex-direction:column;gap:2px}
.fr{display:flex;align-items:flex-start;gap:8px;padding:4px 6px;border-radius:7px;flex-wrap:wrap}
.fr:hover{background:var(--sf)}
.fr input[type=checkbox]{margin-top:4px;accent-color:var(--ac)}
.fr code{direction:ltr;unicode-bidi:embed;font:12px ui-monospace,Menlo,monospace;background:var(--code);color:var(--p2);padding:1px 7px;border-radius:6px}
.fr span.d{color:var(--mu);font-size:13px;flex:1;min-width:140px}
.fr .fv{display:none;gap:6px;width:100%;padding-inline-start:26px;flex-wrap:wrap}.fr.on .fv{display:flex}
.fv label{flex:1;min-width:160px}
.more{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;align-items:end}
.more label{font-size:12px;color:var(--mu)}.more .ck{display:flex;align-items:center;gap:6px;color:var(--tx);font-size:13px}
.empty{text-align:center;color:var(--mu);padding:50px 10px}
.rowb{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
textarea#gout{width:100%;height:460px;direction:ltr;text-align:left;background:var(--code);color:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:12px;font:13px/1.55 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.fld{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.fld label{font-size:12px;color:var(--mu)}.fld input,select.gsel{width:100%;margin-top:2px;padding:6px 9px;border:1px solid var(--bd);border-radius:8px;background:var(--sf);direction:ltr;text-align:left}
#term{position:fixed;inset-inline:0;bottom:0;height:var(--th);background:#0b0f14;border-top:2px solid var(--ac);display:none;flex-direction:column;z-index:30;direction:ltr}
#term.on{display:flex}
#tdrag{position:absolute;top:-6px;left:0;right:0;height:10px;cursor:ns-resize;z-index:2}
#thd{display:flex;align-items:center;gap:6px;padding:4px 8px;background:#121923;color:#cbd5e1;font-size:12px}
#tabs{display:flex;gap:4px;flex:1;overflow:auto}
.tab{display:flex;align-items:center;gap:6px;padding:3px 10px;border-radius:7px;background:#1b2430;cursor:pointer;white-space:nowrap}
.tab.on{background:#0f766e;color:#fff}.tab i{font-style:normal;opacity:.7}.tab i:hover{opacity:1}
#thd button{background:#1b2430;border:1px solid #2a3544;color:#e2e8f0;border-radius:7px;padding:3px 9px;font-size:12px}
#thd button:hover{border-color:#2dd4bf}#thd .stop{background:#7f1d1d;border-color:#b91c1c}#thd .kill{background:#450a0a;border-color:#7f1d1d}
#tbody{flex:1;position:relative;min-height:0}
.tpane{position:absolute;inset:0;padding:6px 8px;display:none}.tpane.on{display:block}
.tpane .xterm{height:100%}
#tmsg{position:absolute;inset:0;display:none;place-items:center;color:#94a3b8;text-align:center;padding:20px}
body.tm main{padding-bottom:calc(var(--th) + 30px)}
body.tm nav{padding-bottom:calc(var(--th) + 24px)}
#modal{position:fixed;inset:0;background:rgba(2,6,23,.6);display:none;place-items:center;z-index:60;padding:20px}
#modal.on{display:grid}
.mbox{background:var(--sf);border:1px solid var(--bd);border-radius:14px;max-width:640px;width:100%;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.mbox h3{margin:0 0 8px}.mbox pre{direction:ltr;text-align:left;background:var(--code);color:var(--cd);padding:10px;border-radius:8px;white-space:pre-wrap;word-break:break-all;max-height:200px;overflow:auto;margin:8px 0 0}
.mbox .row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.mbox .danger{background:var(--l3);color:#fff;border-color:var(--l3)}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#0f766e;color:#fff;padding:8px 18px;border-radius:99px;opacity:0;transition:.2s;pointer-events:none;z-index:80;box-shadow:var(--sh)}
#toast.s{opacity:1;transform:translateX(-50%)}
#menu{display:none}
@media(max-width:900px){#menu{display:inline-block}nav{position:fixed;inset-block:52px 0;inset-inline-start:0;z-index:40;transform:translateX(100%);transition:.2s;box-shadow:var(--sh)}html[dir=ltr] nav{transform:translateX(-100%)}nav.open{transform:none!important}.brand b{display:none}}
</style>
</head>
<body>
<div id="app">
<header>
  <button class="ib" id="menu">☰</button>
  <div class="brand"><div class="logo">Z&gt;_</div><b>Zeyad DevOps Command</b></div>
  <div class="search"><input id="q" autocomplete="off" spellcheck="false"><kbd>Ctrl K</kbd></div>
  <div class="seg" id="dist"><button data-d="all"></button><button data-d="deb">Debian</button><button data-d="rpm">RedHat</button></div>
  <select class="ib" id="lvl"></select>
  <button class="ib" id="lang">عربي</button>
  <button class="ib" id="theme">🌓</button>
  <button class="ib" id="tbtn">⌨ <span id="tbl"></span></button>
</header>
<div id="body"><nav id="nav"></nav><main id="main"></main></div>
</div>
<div id="term">
  <div id="tdrag"></div>
  <div id="thd"><div id="tabs"></div><button id="tnew">＋</button><button class="stop" id="tstop"></button><button class="kill" id="tkill"></button><button id="tclr"></button><button id="text"></button><button id="thide">✕</button></div>
  <div id="tbody"><div id="tmsg"></div></div>
</div>
<div id="modal"><div class="mbox"><h3 id="mt"></h3><div id="mm"></div><pre id="mc"></pre><div class="row"><button class="ib" id="mno"></button><button class="ib danger" id="myes"></button></div></div></div>
<div id="toast"></div>
<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<script src="vendor/addon-web-links.js"></script>
<script src="cmds-a.js"></script>
<script src="cmds-b.js"></script>
<script src="cmds-c.js"></script>
<script src="cmds-d.js"></script>
<script src="cmds-e.js"></script>
<script src="engine.js"></script>
<script src="gen.js"></script>
<script src="gen2.js"></script>
<script src="app.js"></script>
</body>
</html>
